<style>
  :root{
    --ink:#1a1a1a;
    --paper:#fbf8f1;
    --line:#2a2a2a;
    --muted:#9a958a;
    --teal:#3fb6b6;
    --yellow:#f5d623;
    --red:#e0432b;
  }
  html,body{margin:0;padding:0;background:#e9e6df;font-family:"Zen Kurenaido","Yomogi","Kalam",sans-serif;color:var(--ink);}
  .wf{
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:6px;
    box-sizing:border-box;
    padding:14px;
    font-family:"Zen Kurenaido","Yomogi",sans-serif;
    color:var(--ink);
    line-height:1.45;
    font-size:13px;
    overflow:hidden;
    position:relative;
  }
  .wf *{box-sizing:border-box;}
  .wf h1,.wf h2,.wf h3,.wf h4{margin:0;font-family:"Kalam","Zen Kurenaido",sans-serif;font-weight:700;}
  .wf .stack{display:flex;flex-direction:column;gap:10px;}
  .wf .row{display:flex;gap:8px;}
  .wf .box{border:1.5px dashed var(--line);border-radius:4px;padding:8px;background:#fff;}
  .wf .box.solid{border-style:solid;}
  .wf .label{font-size:10px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;font-family:"Kalam",sans-serif;}
  .wf .sectionLabel{
    display:inline-block;border:1.5px solid var(--line);padding:2px 8px;border-radius:99px;font-size:10px;
    background:#fff;color:var(--ink);font-family:"Kalam",sans-serif;font-weight:700;letter-spacing:.05em;
  }
  .wf .img{
    background:repeating-linear-gradient(45deg,#eee 0 6px,#fff 6px 12px);
    border:1.5px solid var(--line);border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;
    font-family:"Kalam",sans-serif;
  }
  .wf .placeholder{height:60px;}
  .wf .scribble{
    background:repeating-linear-gradient(0deg,transparent 0 3px,#0001 3px 4px);
    border-radius:3px;
  }
  .wf .pill{display:inline-block;border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;background:#fff;font-size:11px;}
  .wf .heroBurst{
    position:relative;
    background:
      radial-gradient(circle at 60% 50%, #fff 0 18%, transparent 19%),
      conic-gradient(from 0deg, #f5d62355 0 10deg, transparent 10deg 30deg, #f5d62355 30deg 40deg, transparent 40deg 60deg, #f5d62355 60deg 70deg, transparent 70deg 90deg, #f5d62355 90deg 100deg, transparent 100deg 120deg, #f5d62355 120deg 130deg, transparent 130deg 150deg, #f5d62355 150deg 160deg, transparent 160deg 180deg, #f5d62355 180deg 190deg, transparent 190deg 210deg, #f5d62355 210deg 220deg, transparent 220deg 240deg, #f5d62355 240deg 250deg, transparent 250deg 270deg, #f5d62355 270deg 280deg, transparent 280deg 300deg, #f5d62355 300deg 310deg, transparent 310deg 330deg, #f5d62355 330deg 340deg, transparent 340deg 360deg),
      radial-gradient(circle at 50% 50%, #3fb6b633 0 50%, #3fb6b622 50% 100%);
    border:2px solid var(--line);
    border-radius:6px;
    padding:18px;
    overflow:hidden;
  }
  .wf .burstTitle{
    font-family:"Kalam",sans-serif;font-weight:700;font-size:22px;
    color:var(--red);
    -webkit-text-stroke:1px var(--line);
    line-height:1.1;
    transform:rotate(-2deg);
    display:inline-block;
  }
  .wf .speech{
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;
    position:relative;font-family:"Kalam",sans-serif;font-weight:700;
  }
  .wf .speech:after{
    content:"";position:absolute;bottom:-10px;left:30px;width:14px;height:14px;
    background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);
    transform:rotate(45deg);
  }
  .wf .cta{
    background:#fff;border:2px solid var(--line);border-radius:99px;
    padding:10px 16px;text-align:center;font-family:"Kalam",sans-serif;font-weight:700;
    box-shadow:3px 3px 0 var(--line);
  }
  .wf .cta.red{background:#ffe2dd;}
  .wf .cta.yellow{background:#fff4b3;}
  .wf .cta.teal{background:#cdeded;}
  .wf .divider{height:0;border-top:2px dashed var(--line);margin:4px 0;}
  .wf .panel{
    border:2px solid var(--line);border-radius:4px;background:#fff;padding:10px;position:relative;
    box-shadow:3px 3px 0 #0002;
  }
  .wf .panel .panelHead{
    display:inline-block;background:var(--line);color:#fff;font-family:"Kalam",sans-serif;font-weight:700;
    padding:2px 8px;font-size:11px;margin-bottom:6px;
  }
  .wf .checklist li{margin:2px 0;}
  .wf ul{margin:4px 0;padding-left:18px;}
  .wf .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .wf .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .wf .timeslot{
    border:1.5px solid var(--line);border-radius:3px;padding:4px 6px;background:#fff;
    font-size:11px;font-family:"Kalam",sans-serif;
  }
  .wf .navBar{
    display:flex;gap:4px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);
    padding:6px 0;background:#fff;justify-content:space-between;
  }
  .wf .navBar .tab{flex:1;text-align:center;font-size:10px;border-right:1.5px dashed var(--line);padding:4px;font-family:"Kalam",sans-serif;}
  .wf .navBar .tab:last-child{border-right:none;}
  .wf .navBar .tab.active{background:var(--yellow);font-weight:700;}
  .wf .stickyNav{
    position:sticky;top:0;background:#fff;border:2px solid var(--line);border-radius:4px;padding:6px;
    box-shadow:2px 2px 0 var(--line);
  }
  .wf .accord{
    border:1.5px solid var(--line);border-radius:4px;background:#fff;
  }
  .wf .accord .item{
    border-bottom:1.5px dashed var(--line);padding:8px;display:flex;justify-content:space-between;align-items:center;
    font-family:"Kalam",sans-serif;font-weight:700;font-size:12px;
  }
  .wf .accord .item:last-child{border-bottom:none;}
  .wf .accord .item .plus{font-size:14px;color:var(--muted);}
  .wf .footer{border-top:2px solid var(--line);padding-top:8px;text-align:center;color:var(--muted);font-size:11px;}
  .wf .colored.teal{background:#cdeded;}
  .wf .colored.yellow{background:#fff4b3;}
  .wf .colored.red{background:#ffe2dd;}
  .wf .stamp{
    display:inline-block;border:2px solid var(--red);color:var(--red);padding:2px 6px;
    font-family:"Kalam",sans-serif;font-weight:700;transform:rotate(-6deg);font-size:11px;
  }
  .wf .annot{
    font-family:"Kalam",sans-serif;color:#c14a35;font-size:11px;
  }
  .wf .annot:before{content:"↳ ";}
  .legend{
    background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:18px 24px;
    font-family:"Zen Kurenaido",sans-serif;
  }
  .legend h2{font-family:"Kalam",sans-serif;margin:0 0 8px;font-size:22px;}
  .legend p{margin:0 0 4px;font-size:14px;line-height:1.55;}
  .legend .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .legend .chip{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-family:"Kalam",sans-serif;}
  .legend .swatch{display:inline-block;width:14px;height:14px;border:1.5px solid var(--line);border-radius:3px;vertical-align:-2px;margin-right:4px;}
</style>
